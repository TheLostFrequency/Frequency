<!-- VIEW CONTAINER: EQUALIZER VIEW -->
<main id="viewEq" class="view-panel hidden">
    <div class="eq-overlay">
        <div class="eq-glass-panel">
            
            <!-- Header -->
            <div class="eq-header">
                <div class="eq-title">
                    <span class="eq-icon">///</span>
                    <h2>SIGNAL PARAMETRICS / EQUALIZER</h2>
                </div>
                <div class="eq-actions">
                    <select id="eqPreset" class="eq-dropdown">
                        <option value="flat">PRESET: FLAT</option>
                        <option value="bass">PRESET: BASS BOOST</option>
                        <option value="vocal">PRESET: VOCAL ENHANCE</option>
                        <option value="treble">PRESET: TREBLE BOOST</option>
                    </select>
                </div>
            </div>

            <!-- Real-Time Waveform Visualizer -->
            <div class="eq-visualizer-container">
                <canvas id="eqCanvas" width="650" height="100"></canvas>
            </div>

            <!-- Fader Rack Grid -->
            <div class="eq-rack">
                <!-- SUB BASS (60Hz) -->
                <div class="eq-channel">
                    <span class="eq-value" id="val-60">0 dB</span>
                    <div class="eq-slider-wrapper">
                        <input type="range" class="eq-slider" id="eq-60" data-freq="60" min="-12" max="12" value="0" step="0.5">
                    </div>
                    <span class="eq-label">60 Hz</span>
                    <span class="eq-subtext">SUB</span>
                </div>

                <!-- LOW BASS (250Hz) -->
                <div class="eq-channel">
                    <span class="eq-value" id="val-250">0 dB</span>
                    <div class="eq-slider-wrapper">
                        <input type="range" class="eq-slider" id="eq-250" data-freq="250" min="-12" max="12" value="0" step="0.5">
                    </div>
                    <span class="eq-label">250 Hz</span>
                    <span class="eq-subtext">LOW</span>
                </div>

                <!-- MID (1kHz) -->
                <div class="eq-channel">
                    <span class="eq-value" id="val-1000">0 dB</span>
                    <div class="eq-slider-wrapper">
                        <input type="range" class="eq-slider" id="eq-1000" data-freq="1000" min="-12" max="12" value="0" step="0.5">
                    </div>
                    <span class="eq-label">1 kHz</span>
                    <span class="eq-subtext">MID</span>
                </div>

                <!-- PRESENCE (4kHz) -->
                <div class="eq-channel">
                    <span class="eq-value" id="val-4000">0 dB</span>
                    <div class="eq-slider-wrapper">
                        <input type="range" class="eq-slider" id="eq-4000" data-freq="4000" min="-12" max="12" value="0" step="0.5">
                    </div>
                    <span class="eq-label">4 kHz</span>
                    <span class="eq-subtext">PRESENCE</span>
                </div>

                <!-- TREBLE (12kHz) -->
                <div class="eq-channel">
                    <span class="eq-value" id="val-12000">0 dB</span>
                    <div class="eq-slider-wrapper">
                        <input type="range" class="eq-slider" id="eq-12000" data-freq="12000" min="-12" max="12" value="0" step="0.5">
                    </div>
                    <span class="eq-label">12 kHz</span>
                    <span class="eq-subtext">TREBLE</span>
                </div>
            </div>

            <!-- Footer Controls -->
            <div class="eq-footer">
                <button id="eq-reset" class="eq-btn">FLAT RESPONSE</button>
                <div class="eq-preamp">
                    <label for="preampGain">PREAMP</label>
                    <input type="range" id="preampGain" min="-12" max="12" value="0" step="0.5">
                    <span id="val-preamp" class="eq-value">0 dB</span>
                </div>
            </div>

        </div>
    </div>
</main>
