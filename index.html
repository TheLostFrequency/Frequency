<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FREQUENCY — Personal Music Vault</title>
    <link rel="stylesheet" href="css/main.css">
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- AUTHENTICATION OVERLAY -->
    <div id="authModal" class="overlay-modal active">
        <div class="auth-box">
            <div class="brand-monolith">
                <span class="pedestal-engraving">FREQUENCY</span>
            </div>
            <p class="auth-subtitle">ENTER YOUR PRIVATE FREQUENCY VAULT</p>
            <form id="authForm">
                <input type="email" id="authEmail" placeholder="EMAIL ADDRESS" required />
                <input type="password" id="authPassword" placeholder="PASSWORD" required />
                <div class="auth-actions">
                    <button type="submit" id="btnLogin" class="btn-primary">ENTER VAULT</button>
                    <button type="button" id="btnSignUp" class="btn-secondary">INITIALIZE ACCOUNT</button>
                </div>
            </form>
            <div id="authError" class="error-msg"></div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app" class="app-container hidden">

        <!-- NAVIGATION TOP BAR -->
        <header class="top-bar">
            <div class="brand-logo">FREQUENCY</div>
            <nav class="nav-links">
                <button class="nav-btn active" data-view="collection">VAULT</button>
                <button class="nav-btn" data-view="list">LIST</button>
                <button class="nav-btn" data-view="albums">ALBUMS</button>
                <button class="nav-btn" data-view="playlists">PLAYLISTS</button>
            </nav>
            <div class="user-actions">
                <button id="btnOpenAddSong" class="btn-action">+ ADD TRACK</button>
                <button id="btnLogout" class="btn-text">EXIT</button>
            </div>
        </header>

        <!-- SEARCH BAR OVERLAY -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="SEARCH VAULT BY TITLE, ARTIST, OR ALBUM..." />
        </div>

        <!-- VIEW CONTAINER: SPATIAL COLLECTION VIEW -->
        <main id="viewCollection" class="view-panel active">
            <div class="architectural-stage">
                <!-- Lighting Effects -->
                <div class="spotlight"></div>
                <div class="ambient-shadow"></div>
                
                <!-- Physical Pedestal Monolith -->
                <div class="pedestal">
                    <div class="pedestal-top"></div>
                    <div class="pedestal-front">
                        <div class="pedestal-logo">FREQUENCY</div>
                    </div>
                </div>

                <!-- Physical Interactive Record/CD Collection -->
                <div id="physicalVault" class="physical-vault-container">
                    <!-- Dynamic Vinyl / CD Jewel Cases rendered here -->
                </div>
            </div>
        </main>

        <!-- VIEW CONTAINER: LIST VIEW -->
        <main id="viewList" class="view-panel hidden">
            <div class="list-wrapper">
                <table class="frequency-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>COVER</th>
                            <th>TITLE</th>
                            <th>ARTIST</th>
                            <th>ALBUM</th>
                            <th>ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="songListBody">
                        <!-- Dynamic Song Rows -->
                    </tbody>
                </table>
            </div>
        </main>

        <!-- VIEW CONTAINER: ALBUMS VIEW -->
        <main id="viewAlbums" class="view-panel hidden">
            <div id="albumsGrid" class="albums-grid">
                <!-- Dynamic Album Cards -->
            </div>
        </main>

        <!-- VIEW CONTAINER: PLAYLISTS VIEW -->
        <main id="viewPlaylists" class="view-panel hidden">
            <div class="playlist-header-actions">
                <button id="btnCreatePlaylist" class="btn-action">+ CREATE PLAYLIST</button>
            </div>
            <div id="playlistsGrid" class="playlists-grid">
                <!-- Dynamic Playlists rendered here -->
            </div>
        </main>

        <!-- MINIMALIST FLOATING PLAYER -->
        <footer id="musicPlayer" class="floating-player">
            <div class="player-left">
                <div id="playerCover" class="player-cover-art"></div>
                <div class="player-meta">
                    <div id="playerTitle" class="track-title">NO TRACK SELECTED</div>
                    <div id="playerArtist" class="track-artist">—</div>
                </div>
            </div>
            <div class="player-center">
                <div class="player-controls">
                    <button id="btnShuffle" class="ctrl-btn" title="Shuffle">🔀</button>
                    <button id="btnPrev" class="ctrl-btn">⏮</button>
                    <button id="btnPlayPause" class="ctrl-btn main-play">▶</button>
                    <button id="btnNext" class="ctrl-btn">⏭</button>
                    <button id="btnRepeat" class="ctrl-btn" title="Repeat">🔁</button>
                </div>
                <div class="progress-bar-container">
                    <span id="currentTime">0:00</span>
                    <input type="range" id="seekSlider" value="0" min="0" max="100" step="0.1">
                    <span id="durationTime">0:00</span>
                </div>
            </div>
            <div class="player-right">
                <span class="vol-icon">🔊</span>
                <input type="range" id="volumeSlider" value="80" min="0" max="100">
            </div>
        </footer>

    </div>

    <!-- MODAL: ADD / EDIT SONG -->
    <div id="songModal" class="overlay-modal hidden">
        <div class="modal-card">
            <h2 id="songModalTitle">ADD TRACK TO VAULT</h2>
            <form id="songForm">
                <input type="hidden" id="songId">
                <div class="form-group">
                    <label>SONG TITLE</label>
                    <input type="text" id="inputTitle" required />
                </div>
                <div class="form-group">
                    <label>ARTIST</label>
                    <input type="text" id="inputArtist" required />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>ALBUM</label>
                        <input type="text" id="inputAlbum" />
                    </div>
                    <div class="form-group">
                        <label>GENRE</label>
                        <input type="text" id="inputGenre" />
                    </div>
                </div>
                <div class="form-group">
                    <label>AUDIO FILE (MP3 / WAV)</label>
                    <input type="file" id="inputAudioFile" accept="audio/*" />
                </div>
                <div class="form-group">
                    <label>COVER ARTWORK (IMAGE)</label>
                    <input type="file" id="inputCoverFile" accept="image/*" />
                </div>
                <div class="modal-actions">
                    <button type="button" id="btnCloseSongModal" class="btn-secondary">CANCEL</button>
                    <button type="submit" class="btn-primary">SAVE TO VAULT</button>
                </div>
            </form>
        </div>
    </div>

    <audio id="audioElement" preload="metadata"></audio>

    <!-- JS MODULES -->
    <script src="js/supabaseClient.js"></script>
    <script src="js/audioPlayer.js"></script>
    <script src="js/spatialView.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
